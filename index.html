<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Opening…</title>
<style>
  :root { --bg: #f7f5f0; --fg: #26231e; --muted: #77705f; --line: #ddd6c6; --accent: #2f6b4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a17; --fg: #ece7dc; --muted: #a39c8b; --line: #3a3730; --accent: #7fbf9c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 28rem; width: 100%; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .25rem; }
  p { margin: 0 0 1rem; color: var(--muted); overflow-wrap: anywhere; }
  .links { display: flex; gap: .5rem; flex-wrap: wrap; }
  a { color: var(--accent); border: 1px solid var(--line); border-radius: 8px;
      padding: .5rem .9rem; text-decoration: none; }
  a:hover { border-color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening…</h1>
  <p id="what"></p>
  <div class="links" id="links" hidden></div>
</main>
<script>
// Notion (and some other apps) only open http(s) links. This page takes the target from the part
// after "#", which browsers never send to a server, and hands it to the app that should open it.
// Link form: https://jgenk.github.io/open/#<route>/<path>
// Each route builds its links from fixed parts only, so the page can't be used to send anyone
// elsewhere. To add a route (OneNote, email, ...): add an entry here and a line in README.md.
const ROUTES = {
  // A note in the workshop vault, e.g. #obsidian/tasks/Back up the Primer's signing key
  obsidian: {
    label: "Obsidian",
    app: path => "obsidian://open?vault=workshop&file=" + encodeURIComponent(path),
    web: path => "https://github.com/jgenk/workshop/blob/main/" +
                 path.split("/").map(encodeURIComponent).join("/") + ".md",
    webLabel: "GitHub",
  },
};

const isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const raw = decodeURIComponent(location.hash.slice(1));
const slash = raw.indexOf("/");
const route = ROUTES[raw.slice(0, slash)];
const path = raw.slice(slash + 1).replace(/\.md$/i, "");
const $ = id => document.getElementById(id);

function link(text, href) {
  const a = document.createElement("a");
  a.textContent = text;
  a.href = href;
  $("links").append(a);
}

if (!route || slash < 0 || !path || path.startsWith("/") || path.split("/").includes("..")) {
  $("title").textContent = "This link doesn't point anywhere this page knows.";
} else {
  const app = route.app(path), web = route.web(path);
  $("what").textContent = path;
  link("Open in " + route.label, app);
  link("Open on " + route.webLabel, web);
  if (isPhone) {
    // No local copy on the phone, so go straight to the web copy.
    $("title").textContent = "Opening on " + route.webLabel + "…";
    location.replace(web);
  } else {
    // Try the app; if the page is still in front after a moment, nothing took over, so fall back.
    $("title").textContent = "Opening in " + route.label + "…";
    let handedOff = false;
    const done = () => { handedOff = true; };
    addEventListener("blur", done);
    document.addEventListener("visibilitychange", () => { if (document.hidden) done(); });
    location.href = app;
    setTimeout(() => {
      $("links").hidden = false;
      if (handedOff) {
        $("title").textContent = "Opened in " + route.label + ". You can close this tab.";
      } else {
        $("title").textContent = route.label + " didn't open, so going to " + route.webLabel + "…";
        location.replace(web);
      }
    }, 1500);
  }
}
</script>
</body>
</html>
